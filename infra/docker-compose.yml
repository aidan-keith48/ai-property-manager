services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: apm_dev_password
      POSTGRES_DB: apm_dev
    ports:
      # Host port 5433, not 5432 — 5432 may already be bound by another
      # project's Postgres container on this machine.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6380, not 6379 — 6379 may already be bound by another
      # project's Redis container on this machine.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
